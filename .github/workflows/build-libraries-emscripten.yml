name: Build Emscripten (WebAssembly) libraries

on:
  workflow_dispatch:

jobs:
  build-libraries-emscripten:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install autoconf automake cmake libtool m4 ninja-build
        git clone https://github.com/emscripten-core/emsdk emsdk
        cd emsdk
        # Emscripten 6.0.10 development build, the first with EXPORTED_FUNCTIONS honoured under -sWASM_BINDGEN; pin the release once it is out
        ./emsdk install sdk-releases-20b311cf9232508d006e8f014ffc06719ee10f81-64bit
        ./emsdk activate sdk-releases-20b311cf9232508d006e8f014ffc06719ee10f81-64bit

    - name: Build Emscripten (WebAssembly) libraries
      run: |
        source emsdk/emsdk_env.sh
        export M4=/usr/bin/m4
        scripts/compile_libs/gen_libs.sh build-webasm-libs webasm

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ddnet-libs-webasm
        path: build-webasm-libs/ddnet-libs
