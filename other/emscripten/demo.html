<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Watch a DDNet demo in a web browser.">
		<title>DDNet Demo Viewer</title>
		<link rel="icon" type="image/x-icon" href="DDNet.ico">
		<script src="coi-serviceworker.js"></script>
		<link rel="stylesheet" href="ddnet-page.css">
		<link rel="stylesheet" href="ddnet-viewer.css">
	</head>
	<body>
		<noscript><p><b>You need to allow JavaScript in your browser to use this website.</b></p></noscript>
		<div id="error" style="display: none"></div>
		<canvas id="canvas" style="display: none">Canvas not supported.</canvas>
		<div id="player-controls" style="display: none">
			<button id="play-button" title="Space">Pause</button>
			<input id="seek" type="range" min="0" max="1000" value="0" step="1" title="Seek">
			<span id="time">0:00 / 0:00</span>
			<button id="slower" title="Down arrow">&minus;</button>
			<span id="speed">1.00&times;</span>
			<button id="faster" title="Up arrow">+</button>
			<button id="restart" title="Home">Restart</button>
			<button id="export-button">Export video</button>
		</div>
		<script src="ddnet-demo-viewer.js"></script>
		<script src="ddnet-loader.js"></script>
		<script>
			// A demo is dropped onto the window, or named as `demo.html#demo=<url>`.
			const started = DDNetLoader.page({
				module: DDNetDemoViewer,
				programName: "Demo viewer",
				accept: [".demo"],
				urlParams: ["demo"],
				elements: {
					canvas: document.getElementById('canvas'),
					error: document.getElementById('error'),
				},
			});
		</script>
		<script>
			// The bar under the canvas. The viewer answers to the keyboard as well,
			// but a page shows no key bindings and nobody would go looking for them,
			// so everything it can do has a button here. The other end of these is
			// the `DemoViewer*` block in `src/engine/client/demo_viewer_client.cpp`.
			(function() {
				const playerControls = document.getElementById('player-controls');
				const playButton = document.getElementById('play-button');
				const seek = document.getElementById('seek');
				const time = document.getElementById('time');
				const speed = document.getElementById('speed');
				const exportButton = document.getElementById('export-button');
				var seeking = false;
				var exportStarted = false;
				// Encoding a video is the browser's to do, and not every browser
				// does it. Better said here than by an export that starts and
				// then cannot finish.
				if (typeof VideoEncoder === "undefined") {
					exportButton.disabled = true;
					exportButton.title = "This browser has no video encoder";
				}

				// The page is there before the viewer is and outlives it, so every
				// call has to survive being made outside of that: until there is
				// one, and once there is no longer one, they all answer `null`.
				var viewer = null;
				const demo = DDNetLoader.demoControls({
					call: (name, returnType, argTypes, args) =>
						viewer == null ? null : viewer.call(name, returnType, argTypes, args),
				});
				// A page that cannot run this at all has been told why once
				// already, which is enough: there is nothing here to steer.
				started.then(instance => { viewer = instance; }, () => {});

				// Where a link says to start, and how. Once, as soon as there is a
				// demo to say it to - `#t=90&speed=0.5&paused=1`, in the fragment
				// so that the demo somebody sent stays between them and whoever
				// they sent it to.
				var linkApplied = false;
				function applyLink(length) {
					if (linkApplied) {
						return;
					}
					linkApplied = true;
					const startTime = parseFloat(DDNetLoader.urlParameter("t"));
					if (isFinite(startTime) && startTime > 0) {
						demo.seekTime(Math.min(startTime, length));
					}
					const startSpeed = parseFloat(DDNetLoader.urlParameter("speed"));
					if (isFinite(startSpeed) && startSpeed > 0) {
						demo.speed(startSpeed);
					}
					if (DDNetLoader.urlParameter("paused") === "1") {
						demo.pause();
					}
				}

				function formatTime(seconds) {
					const total = Math.max(0, Math.round(seconds));
					return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
				}

				playButton.addEventListener('click', () => {
					if (demo.paused()) {
						demo.play();
					} else {
						demo.pause();
					}
				});
				seek.addEventListener('input', () => {
					seeking = true;
				});
				seek.addEventListener('change', () => {
					demo.seek(seek.value / seek.max);
					seeking = false;
				});
				document.getElementById('slower').addEventListener('click', () => {
					demo.speed(demo.speed() / 1.25);
				});
				document.getElementById('faster').addEventListener('click', () => {
					demo.speed(demo.speed() * 1.25);
				});
				document.getElementById('restart').addEventListener('click', () => {
					demo.restart();
				});
				exportButton.addEventListener('click', async () => {
					// The browser only hands over a download that came out of a click,
					// so the export has to start from this handler and not from a
					// question the page asks itself later. Asking where to save is
					// the same: it has to happen while this click is still what the
					// browser thinks the user is doing. What is written there is
					// written while the demo renders, so nothing is kept in memory
					// and a video the size of a film is no different from a short
					// one.
					if (viewer != null && window.showSaveFilePicker) {
						try {
							const handle = await window.showSaveFilePicker({
								suggestedName: "video.mp4",
								types: [{ description: "MP4 video", accept: { "video/mp4": [".mp4"] } }],
							});
							viewer.setVideoSink({ stream: await handle.createWritable(), done: () => null });
						} catch (error) {
							// The dialog was dismissed, so the export was not asked for.
							return;
						}
					}
					const canvas = document.getElementById('canvas');
					exportStarted = demo.startExport(canvas.width, canvas.height, 60, false);
					exportButton.disabled = true;
					exportButton.textContent = exportStarted ? "Exporting…" : "Export failed";
				});

				// The page follows the demo rather than the demo telling the page:
				// the viewer holds the main thread for as long as it draws and only
				// lets go between frames, so asking is both simpler and cheaper than
				// being called back.
				setInterval(() => {
					const length = demo.length();
					if (length === null || length <= 0.0) {
						playerControls.style.display = "none";
						return;
					}
					playerControls.style.display = "flex";
					applyLink(length);
					const progress = demo.progress();
					if (!seeking) {
						seek.value = Math.round(progress * seek.max);
					}
					time.textContent = `${formatTime(progress * length)} / ${formatTime(length)}`;
					speed.textContent = `${demo.speed().toFixed(2)}×`;
					playButton.textContent = demo.paused() ? "Play" : "Pause";
					if (exportStarted && !demo.exporting()) {
						exportStarted = false;
						exportButton.textContent = "Export finished";
					}
				}, 200);
			})();
		</script>
	</body>
</html>
