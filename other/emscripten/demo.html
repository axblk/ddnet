<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="description" content="Watch a DDNet demo in a web browser.">
		<title>DDNet Demo Player</title>
		<link rel="icon" type="image/x-icon" href="DDNet.ico">
		<script src="coi-serviceworker.js"></script>
		<link rel="stylesheet" href="ddnet-page.css">
		<!-- What the bar the package builds is dressed in. A page that puts a
		     viewer in a box loads this one file and gets the same bar. -->
		<link rel="stylesheet" href="ddnet-viewer.css">
		<!-- The packages by their own names, which is how a page that installed
		     them from a registry would say them. Here they sit beside this page
		     rather than under `node_modules`, and this is what says so - the
		     code below is the same either way. -->
		<script type="importmap">
		{
			"imports": {
				"@ddnet/base": "./ddnet-base.js",
				"@ddnet/demo-player": "./demo-player.js"
			}
		}
		</script>
		<!-- The module fetches the program itself, which is one round trip
		     after this page has been read. Saying so here starts it with the
		     rest of them instead. -->
		<link rel="preload" as="script" href="ddnet-demo-player.js" crossorigin>
	</head>
	<body>
		<noscript><p><b>You need to allow JavaScript in your browser to use this website.</b></p></noscript>
		<!-- The element the package brings, which is what anybody embedding a
		     demo in a page of their own writes - one line, a `src`, and
		     `controls="html"` for the bar of real buttons the package builds.
		     This page is that line plus the two things only a page whose whole
		     job is one demo has to say: a way in when nothing was named, and an
		     address that follows what is being watched.
		     What the element says while a demo is on its way, and what it says
		     when one cannot be shown, it says over the picture itself. -->
		<ddnet-demo id="viewer" controls="html">
			<!-- Nothing named in the address, so nothing to show yet. A file can be
			     dropped onto the page, and a phone has nothing to drop with, so it
			     can be chosen here as well. -->
			<div id="open" class="viewer-open" slot="controls" hidden>
				<div class="viewer-panel viewer-open-panel">
					<div class="viewer-panel-title">Open a demo</div>
					<p class="viewer-open-hint">Choose a <code>.demo</code> file, or drop one onto this page.</p>
					<!-- Why the last one was no good, where the next one is
					     chosen. -->
					<p id="open-message" class="viewer-panel-message" role="status" hidden></p>
					<div class="viewer-panel-actions">
						<button id="open-button" class="viewer-text-button" disabled>Choose a demo</button>
					</div>
					<input id="open-file" type="file" accept=".demo" hidden>
				</div>
			</div>
		</ddnet-demo>
		<!-- What a link says has to be on the element before it starts, and it
		     starts the moment the package below defines it - so this runs
		     while the page is being read, which no module does. The element
		     knows every one of these words already: it is what anybody else
		     writing `<ddnet-demo t="4" end="8">` says. -->
		<script>
			(function() {
				const element = document.getElementById('viewer');
				const link = new URLSearchParams(location.hash.replace(/^#/, ""));
				for (const [parameter, attribute] of [["demo", "src"], ["t", "t"], ["end", "end"], ["speed", "speed"], ["paused", "paused"], ["spec", "spec"]]) {
					const value = link.get(parameter);
					if (value !== null && value !== "") {
						element.setAttribute(attribute, value);
					}
				}
			})();
		</script>
		<script type="module">
			import DDNetBase from "@ddnet/base";
			import "@ddnet/demo-player";

			// The element started the moment the import above defined it, with
			// what the address said already on it - where to start, how fast,
			// which piece, whose shoulder to watch over - and it built its own
			// bar because `controls="html"` asked for one. Everything that bar
			// does belongs to the package; what is left here is what belongs to
			// a page.
			//
			// A demo is dropped onto the picture, or named as
			// `demo.html#demo=<url>`.
			const element = document.getElementById('viewer');
			// A page that cannot run this at all has been told why by the
			// element, over the picture, which is enough: there is nothing here
			// to steer.
			element.ready.catch(() => {});

			// Nothing named in the address, so the page offers a way in of its
			// own. A demo can be dropped onto the picture - the element takes
			// it there - but a phone has nothing to drop with, and a file
			// chosen here goes the same way a dropped one does.
			const opener = document.getElementById('open');
			const openButton = document.getElementById('open-button');
			const openFile = document.getElementById('open-file');
			const openMessage = document.getElementById('open-message');
			function offer(show, message) {
				opener.hidden = !show;
				openMessage.textContent = message || "";
				openMessage.hidden = !message;
			}
			offer(!element.hasAttribute("src"));
			// Nothing to hand a file to until the program is running.
			element.ready.then(() => { openButton.disabled = false; }, () => {});
			// A demo that came from anywhere - the address, a drop, or this
			// button - takes the offer away.
			element.addEventListener('loadedmetadata', () => offer(false));
			openButton.addEventListener('click', () => openFile.click());
			openFile.addEventListener('change', async () => {
				const file = openFile.files[0];
				// The same file twice in a row is still a choice, and without
				// this the second time would go unnoticed.
				openFile.value = "";
				if (file == null || element.controls == null) {
					return;
				}
				offer(false);
				forgetLink();
				try {
					await element.load(file);
				} catch (error) {
					offer(true, (error && error.message) || String(error));
				}
			});
			// One dropped on the picture is the element's to take; the page
			// only has to stop offering, and to stop applying a link that was
			// about another demo.
			document.addEventListener('drop', () => { offer(false); forgetLink(); }, true);

			// What a link said is on the element, and the element is what
			// applies it: where to start, how fast, which piece, whose shoulder
			// to watch over. A demo that somebody opens here is not the demo
			// the link was written about, so the link stops applying to it.
			function forgetLink() {
				for (const name of ["t", "end", "speed", "paused", "spec"]) {
					element.removeAttribute(name);
				}
			}

			// The address bar follows the demo, so that what somebody copies
			// out of it is what they are watching: where they are, how fast,
			// and whether it stands still. What is at its default is left out,
			// so a link stays as short as what it says.
			//
			// Asked for rather than waited for: a demo that stands still sends
			// no `timeupdate`, and a piece marked out while it stands still is
			// exactly the thing somebody is about to copy a link to.
			setInterval(() => {
				const player = element.controls;
				const length = element.duration;
				if (player == null || !(length > 0)) {
					return;
				}
				// A marked piece is what the link is about, so it says where
				// that piece is rather than where the demo happens to stand:
				// what somebody copies is what they marked.
				const clip = player.clip();
				const spectating = player.spectating();
				DDNetBase.setUrlParameters({
					end: clip === null ? null : Math.round(clip.end),
					t: clip !== null ? Math.round(clip.start) : Math.round(element.currentTime),
					speed: Math.abs(element.playbackRate - 1) < 0.005 ? null : element.playbackRate.toFixed(2),
					paused: element.paused ? 1 : null,
					spec: spectating >= 0 ? spectating : null,
				});
			}, 200);
		</script>
	</body>
</html>
