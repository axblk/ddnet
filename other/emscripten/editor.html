<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<meta name="description" content="Edit a DDNet map in a web browser.">
		<title>DDNet Map Editor</title>
		<link rel="icon" type="image/x-icon" href="DDNet.ico">
		<script src="coi-serviceworker.js"></script>
		<link rel="stylesheet" href="ddnet-page.css">
		<!-- What the editor is dressed in; a page with one in a box loads it too. -->
		<link rel="stylesheet" href="ddnet-editor.css">
		<script type="importmap">
		{
			"imports": {
				"@ddnet/base": "./ddnet-base.js",
				"@ddnet/map-editor": "./map-editor.js"
			}
		}
		</script>
		<link rel="preload" as="script" href="ddnet-map-editor.js" crossorigin>
		<style>
			/* The editor fills the window; the box lays itself out. */
			body { margin: 0; height: 100dvh; overflow: hidden; }
			ddnet-editor { height: 100%; }
			/* What the page itself has to say stands in the status line, after
			   what the editor says: the map's size, or why nothing is open. */
			.page-note { margin: 0; color: var(--text-2); font: var(--type-sm); white-space: nowrap; }
			.page-note:empty { display: none; }
		</style>
	</head>
	<body>
		<noscript><p><b>You need to allow JavaScript in your browser to use this website.</b></p></noscript>
		<ddnet-editor id="editor" urlparam="map" remember>
			<p class="page-note" id="message" slot="status" role="status">Starting&hellip;</p>
		</ddnet-editor>
		<script type="module">
			import "@ddnet/map-editor";
			const box = document.getElementById("editor");
			const message = document.getElementById("message");
			const say = text => { message.textContent = text; };
			const editor = await box.ready.catch(error => { say((error && error.message) || String(error)); throw error; });
			// The page's own handle on what it started - for the console and for
			// the tests. A page may claim a name; the package may not, and does not.
			window.ddnetEditor = box;

			// The one thing the editor does not say about the map itself: how
			// big it is. Its name and whether it is saved are on its tab.
			function describe() {
				const size = editor.map < 0 ? null : editor.size();
				say(size === null ? "" : `${size.width} × ${size.height} tiles`);
			}
			describe();
			for (const type of ["document", "saved", "loaded", "closed"]) { editor.addEventListener(type, () => describe()); }
			editor.addEventListener("error", event => say(`Could not ${event.detail && event.detail.what === "save" ? "save" : "open"} that.`));
		</script>
	</body>
</html>
