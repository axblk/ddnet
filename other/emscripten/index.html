<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="description" content="The DDNet client running in a web browser.">
		<title>DDNet Web</title>
		<link rel="icon" type="image/x-icon" href="DDNet.ico">
		<script src="coi-serviceworker.js"></script>
		<link rel="stylesheet" href="ddnet-page.css">
	</head>
	<body>
		<noscript><p><b>You need to allow JavaScript in your browser to use this website.</b></p></noscript>
		<div id="error" style="display: none"></div>
		<div id="output" style="display: none">
			<h2>Console log</h2>
			<div id="outputcontent"></div>
		</div>
		<canvas id="canvas">Canvas not supported.</canvas>
		<script src="DDNet.js"></script>
		<script type="module">
			import DDNetLoader from "./ddnet-loader.js";

			// A demo, a map or a `ddnet://` link is dropped onto the window.
			DDNetLoader.page({
				module: DDNetClient,
				programName: "Client",
				accept: [".demo", ".map"],
				acceptLinks: true,
				elements: {
					canvas: document.getElementById('canvas'),
					error: document.getElementById('error'),
					output: document.getElementById('output'),
					outputContent: document.getElementById('outputcontent'),
				},
			// A browser that cannot run this has been told why in the log, which
			// is where everything else that goes wrong is said as well.
			}).catch(() => {});
		</script>
	</body>
</html>
