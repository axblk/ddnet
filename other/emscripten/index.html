<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="description" content="The DDNet client running in a web browser.">
		<title>DDNet Web</title>
		<link rel="icon" type="image/x-icon" href="DDNet.ico">
		<script src="coi-serviceworker.js"></script>
		<link rel="stylesheet" href="ddnet-page.css">
	</head>
	<body>
		<noscript><p><b>You need to allow JavaScript in your browser to use this website.</b></p></noscript>
		<div id="error" hidden></div>
		<div id="output" hidden>
			<h2>Console log</h2>
			<div id="outputcontent"></div>
		</div>
		<canvas id="canvas" tabindex="0" aria-label="DDNet">Canvas not supported.</canvas>
		<script src="DDNet.js"></script>
		<script type="module">
			import { Program } from "./ddnet-base.js";

			const canvas = document.getElementById('canvas');
			const error = document.getElementById('error');
			const output = document.getElementById('output');
			const outputContent = document.getElementById('outputcontent');
			// The log is collected while the client starts and shown once it
			// is all there is to look at: a fatal error, or the end.
			const showLog = () => { output.hidden = false; };

			// A demo, a map or a `ddnet://` link is dropped onto the window.
			const client = new Program({ module: DDNetClient, programName: "Client", canvas, accept: [".demo", ".map"], acceptLinks: true });
			client.addEventListener('output', event => {
				const { message, kind } = event.detail;
				const line = Object.assign(document.createElement('span'), { className: "line", textContent: message });
				if (kind.error) {
					line.style.color = "red";
				} else if (kind.color) {
					line.style.borderColor = kind.color;
				}
				if (kind.bold) {
					line.style.fontWeight = "bold";
				}
				outputContent.append(line, document.createElement('br'));
				outputContent.scrollTop = outputContent.scrollHeight;
				if (kind.fatal) {
					showLog();
				}
			});
			client.addEventListener('exit', () => {
				const reload = Object.assign(document.createElement('button'), { textContent: "Reload page" });
				reload.addEventListener('click', () => location.reload());
				outputContent.append(reload);
				showLog();
			});
			client.start().then(() => canvas.focus(), startError => {
				error.textContent = startError.message;
				error.hidden = false;
			});
		</script>
	</body>
</html>
