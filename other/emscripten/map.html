<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="description" content="Look at a DDNet map in a web browser.">
		<title>DDNet Map Viewer</title>
		<link rel="icon" type="image/x-icon" href="DDNet.ico">
		<script src="coi-serviceworker.js"></script>
		<link rel="stylesheet" href="ddnet-page.css">
		<!-- What the buttons the package builds are dressed in. A page that
		     puts a map in a box loads this one file and gets the same ones. -->
		<link rel="stylesheet" href="ddnet-viewer.css">
		<!-- The packages by their own names, which is how a page that installed
		     them from a registry would say them. Here they sit beside this page
		     rather than under `node_modules`, and this is what says so - the
		     code below is the same either way. -->
		<script type="importmap">
		{
			"imports": {
				"@ddnet/base": "./ddnet-base.js",
				"@ddnet/map-viewer": "./map-viewer.js"
			}
		}
		</script>
		<!-- The module fetches the program itself, which is one round trip
		     after this page has been read. Saying so here starts it with the
		     rest of them instead. -->
		<link rel="preload" as="script" href="ddnet-map-viewer.js" crossorigin>
	</head>
	<body>
		<noscript><p><b>You need to allow JavaScript in your browser to use this website.</b></p></noscript>
		<!-- The element the package brings, which is what anybody putting a map
		     into a page of their own writes - one line, a `src`, and
		     `controls="html"` for the buttons the package builds. This page is
		     that line plus the two things only a page whose whole job is one
		     map has to say: a way in when nothing was named, and an address
		     that follows what is being looked at. -->
		<ddnet-map id="viewer" controls="html">
			<!-- Nothing named in the address, so nothing to show yet. A file can be
			     dropped onto the page, and a phone has nothing to drop with, so it
			     can be chosen here as well. -->
			<div id="open" class="viewer-open" slot="controls" hidden>
				<div class="viewer-panel viewer-open-panel">
					<div class="viewer-panel-title">Open a map</div>
					<p class="viewer-open-hint">Choose a <code>.map</code> file, or drop one onto this page.</p>
					<!-- Why the last one was no good, where the next one is
					     chosen. -->
					<p id="open-message" class="viewer-panel-message" role="status" hidden></p>
					<div class="viewer-panel-actions">
						<button id="open-button" class="viewer-text-button" disabled>Choose a map</button>
					</div>
					<input id="open-file" type="file" accept=".map" hidden>
				</div>
			</div>
		</ddnet-map>
		<!-- What a link says has to be on the element before it starts, and it
		     starts the moment the package below defines it - so this runs
		     while the page is being read, which no module does. The element
		     knows every one of these words already: it is what anybody else
		     writing `<ddnet-map x="120" y="64" tiles="90">` says. -->
		<script>
			(function() {
				const element = document.getElementById('viewer');
				const link = new URLSearchParams(location.hash.replace(/^#/, ""));
				for (const [parameter, attribute] of [["map", "src"], ["x", "x"], ["y", "y"], ["tiles", "tiles"]]) {
					const value = link.get(parameter);
					if (value !== null && value !== "") {
						element.setAttribute(attribute, value);
					}
				}
			})();
		</script>
		<script type="module">
			import DDNetBase from "@ddnet/base";
			import "@ddnet/map-viewer";

			// The element started the moment the import above defined it, with
			// what the address said already on it - which map, where to look
			// and how much of it to show - and it built its own buttons because
			// `controls="html"` asked for them. What those buttons do belongs
			// to the package; what is left here is what belongs to a page.
			//
			// A map is dropped onto the picture, or named as
			// `map.html#map=<url>`.
			const element = document.getElementById('viewer');
			// A page that cannot run this at all has been told why by the
			// element, over the picture, which is enough: there is nothing here
			// to steer.
			element.ready.catch(() => {});

			// Nothing named in the address, so the page offers a way in of its
			// own. A map can be dropped onto the picture - the element takes it
			// there - but a phone has nothing to drop with, and a file chosen
			// here goes the same way a dropped one does.
			const opener = document.getElementById('open');
			const openButton = document.getElementById('open-button');
			const openFile = document.getElementById('open-file');
			const openMessage = document.getElementById('open-message');
			function offer(show, message) {
				opener.hidden = !show;
				openMessage.textContent = message || "";
				openMessage.hidden = !message;
			}
			offer(!element.hasAttribute("src"));
			// Nothing to hand a file to until the program is running.
			element.ready.then(() => { openButton.disabled = false; }, () => {});
			openButton.addEventListener('click', () => openFile.click());
			openFile.addEventListener('change', async () => {
				const file = openFile.files[0];
				// The same file twice in a row is still a choice, and without
				// this the second time would go unnoticed.
				openFile.value = "";
				if (file == null || element.controls == null) {
					return;
				}
				offer(false);
				forgetLink();
				try {
					await element.load(file);
				} catch (error) {
					offer(true, (error && error.message) || String(error));
				}
			});
			// One dropped on the picture is the element's to take; the page
			// only has to stop offering, and to stop applying a link that was
			// about another map.
			document.addEventListener('drop', () => { offer(false); forgetLink(); }, true);

			// What a link said is on the element, and the element is what
			// applies it: where to look and how much of the map to show, as
			// soon as the map it belongs to is unpacked. A map that somebody
			// opens here is not the map the link was written about, so the link
			// stops applying to it.
			function forgetLink() {
				for (const name of ["x", "y", "tiles"]) {
					element.removeAttribute(name);
				}
			}

			// The address bar follows the view, so that what somebody copies
			// out of it is what they are looking at. The page asks rather than
			// being told: a map viewer has nothing to say for itself the way a
			// demo has a clock.
			setInterval(() => {
				const viewer = element.controls;
				if (viewer == null || !viewer.loaded()) {
					return;
				}
				// A map that came from anywhere takes the offer away.
				offer(false);
				const center = viewer.center();
				const tiles = viewer.tilesAcross();
				if (center !== null && tiles > 0) {
					DDNetBase.setUrlParameters({
						x: center.x.toFixed(1),
						y: center.y.toFixed(1),
						tiles: tiles.toFixed(1),
					});
				}
			}, 200);
		</script>
	</body>
</html>
