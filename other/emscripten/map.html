<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="description" content="Look at a DDNet map in a web browser.">
		<title>DDNet Map Viewer</title>
		<link rel="icon" type="image/x-icon" href="DDNet.ico">
		<script src="coi-serviceworker.js"></script>
		<link rel="stylesheet" href="ddnet-page.css">
	</head>
	<body>
		<noscript><p><b>You need to allow JavaScript in your browser to use this website.</b></p></noscript>
		<div id="error" style="display: none"></div>
		<canvas id="canvas">Canvas not supported.</canvas>
		<script src="ddnet-map-viewer.js"></script>
		<script src="ddnet-loader.js"></script>
		<script>
			// A map is dropped onto the window, or named as `map.html#map=<url>`.
			//
			// The page brings no controls of its own: a map fills the window and
			// the viewer draws what there is to press into a corner of it. Moving
			// and zooming stay on the pointer, where they belong. The other end of
			// what is left here is the `MapViewer*` block in
			// `src/game/map/standalone/map_viewer_main.cpp`.
			const started = DDNetLoader.page({
				module: DDNetMapViewer,
				programName: "Map viewer",
				accept: [".map"],
				urlParams: ["map"],
				elements: {
					canvas: document.getElementById('canvas'),
					error: document.getElementById('error'),
				},
			});
		</script>
		<script>
			(function() {
				// The page is there before the viewer is and outlives it, so every
				// call has to survive being made outside of that: until there is
				// one, and once there is no longer one, they all answer `null`.
				var viewer = null;
				const map = DDNetLoader.mapControls({
					call: (name, returnType, argTypes, args) =>
						viewer == null ? null : viewer.call(name, returnType, argTypes, args),
				});
				// A page that cannot run this at all has been told why once
				// already, which is enough: there is nothing here to steer.
				started.then(instance => { viewer = instance; }, () => {});

				// Where a link says to look, and how much of the map to show:
				// `#x=120&y=64&tiles=90`, in tiles, applied once as soon as
				// there is a map to apply it to. A map that is dropped in later
				// brings its own view and keeps it.
				var linkApplied = false;
				function applyLink() {
					if (linkApplied) {
						return;
					}
					linkApplied = true;
					const tiles = parseFloat(DDNetLoader.urlParameter("tiles"));
					if (isFinite(tiles) && tiles > 0) {
						map.tilesAcross(tiles);
					}
					const x = parseFloat(DDNetLoader.urlParameter("x"));
					const y = parseFloat(DDNetLoader.urlParameter("y"));
					if (isFinite(x) && isFinite(y)) {
						map.center(x, y);
					}
				}

				// The address bar follows the view, so that what somebody copies
				// out of it is what they are looking at.
				function updateLink(center, tiles) {
					DDNetLoader.setUrlParameters({
						x: center.x.toFixed(1),
						y: center.y.toFixed(1),
						tiles: tiles.toFixed(1),
					});
				}

				// The page asks rather than being told: the viewer holds the main
				// thread for as long as it draws and only lets go between frames.
				setInterval(() => {
					if (!map.loaded()) {
						return;
					}
					applyLink();
					const center = map.center();
					const tiles = map.tilesAcross();
					if (center !== null && tiles > 0) {
						updateLink(center, tiles);
					}
				}, 200);
			})();
		</script>
	</body>
</html>
