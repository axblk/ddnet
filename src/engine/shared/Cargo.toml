[package]
name = "ddnet-engine-shared"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
publish = false
license = "Zlib"

[lib]
crate-type = ["rlib", "staticlib"]
path = "lib.rs"

[features]
quic = ["dep:quinn-proto", "dep:rcgen", "dep:ring", "dep:rustls", "dep:time", "dep:wtransport-proto"]
quic-tests = ["quic"]

[dependencies]
ddnet-base = { path = "../../base" }
ddnet-engine = { path = ".." }

cxx = { workspace = true }
quinn-proto = { version = "=0.11.16", default-features = false, features = ["rustls-ring"], optional = true }
rcgen = { version = "=0.14.7", default-features = false, features = ["ring"], optional = true }
ring = { version = "=0.17.14", optional = true }
rustls = { version = "=0.23.35", default-features = false, features = ["ring", "std"], optional = true }
# rcgen accepts newer time releases whose MSRV exceeds this workspace's 1.85.
time = { version = "=0.3.44", optional = true }
wtransport-proto = { version = "=0.7.0", optional = true }

[dev-dependencies]
ddnet-test = { path = "../../rust-bridge/test", features = ["link-test-libraries"] }
